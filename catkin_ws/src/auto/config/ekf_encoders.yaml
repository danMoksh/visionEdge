# EKF Configuration with Wheel Encoders

# --- (General, Frame, and Covariance settings are the same as before) ---
frequency: 30
sensor_timeout: 0.1
two_d_mode: true
transform_time_offset: 0.0
transform_timeout: 0.1
print_diagnostics: true
debug: false
map_frame: map
odom_frame: odom
base_link_frame: base_link
world_frame: odom
publish_tf: true
# ... (copy the large process_noise_covariance and initial_estimate_covariance from your old ekf.yaml)

# =================== SENSOR INPUTS ===================

# Wheel Odometry from the new PID controller
odom0: /odom
odom0_config: [false, false, false,  # x, y, z
               false, false, false,  # roll, pitch, yaw
               true,  false, false,  # vx, vy, vz (Only using linear X velocity)
               false, false, true,   # vroll, vpitch, vyaw (Only using yaw velocity)
               false, false, false]  # ax, ay, az
odom0_differential: false
odom0_relative: false
odom0_queue_size: 10

# GPS Data (now odom1)
odom1: /odometry/gps
odom1_config: [true,  true,  false,
               false, false, false,
               false, false, false,
               false, false, false,
               false, false, false]
odom1_differential: false
odom1_relative: false
odom1_queue_size: 2

# IMU from Compass
imu0: /imu/data
imu0_config: [false, false, false,
              false, false, true,   # Only Yaw
              false, false, false,
              false, false, false,
              false, false, false]
imu0_differential: false
imu0_relative: false
imu0_queue_size: 2

# IMU from MPU6050
imu1: /imu/data_raw
imu1_config: [false, false, false,
              false, false, false,
              false, false, false,
              true,  true,  true,   # Angular velocities
              true,  true,  false]  # Linear accelerations (no Z)
imu1_differential: false
imu1_relative: false
imu1_queue_size: 10
imu1_remove_gravitational_acceleration: true
