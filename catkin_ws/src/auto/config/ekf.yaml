# IMU from Compass (for absolute heading/orientation)
imu0: /imu/data
imu0_config: [false, false, false,  # x, y, z position
              false, false, true,   # roll, pitch, yaw orientation
              false, false, false,  # x, y, z linear velocity  
              false, false, false,  # roll, pitch, yaw angular velocity
              false, false, false]  # x, y, z linear acceleration
imu0_differential: false  # Use absolute measurements
imu0_relative: false
imu0_queue_size: 10
imu0_remove_gravitational_acceleration: false

# IMU from MPU6050 (for angular velocity and linear acceleration)
imu1: /imu/data_raw
imu1_config: [false, false, false,  # x, y, z position
              false, false, false,  # roll, pitch, yaw orientation  
              false, false, false,  # x, y, z linear velocity
              true,  true,  true,   # roll, pitch, yaw angular velocity
              true,  true,  false]  # x, y, z linear acceleration (no Z to avoid gravity issues)
imu1_differential: false
imu1_relative: false  
# yaw offset
# imu0_yaw_offset: 1.5708 
imu1_queue_size: 10
imu1_remove_gravitational_acceleration: true

# GPS Data (converted by navsat_transform_node)
odom0: /odometry/gps
odom0_config: [true,  true,  false,  # x, y, z position
               false, false, false,  # roll, pitch, yaw orientation
               false, false, false,  # x, y, z linear velocity
               false, false, false,  # roll, pitch, yaw angular velocity  
               false, false, false]  # x, y, z linear acceleration
odom0_differential: false
odom0_relative: false
odom0_queue_size: 10
